version: '3.8'
services:
  channels-dvr-manager:
    build:
      context: .
      args:
        # Build-time variables (baked into the JS bundle)
        - VITE_STREAM_URL=${VITE_STREAM_URL}
        - VITE_UNSPLASH_CLIENT_ID=${VITE_UNSPLASH_CLIENT_ID}
    image: channels-dvr-manager:latest
    ports:
      - "8081:80"
    environment:
      API_PROXY_URL: ${API_PROXY_URL}
      CHANNELS_DVR_URL: ${CHANNELS_DVR_URL:-http://www.channels.local}
      CHANNELS_DVR_CRON: ${CHANNELS_DVR_CRON:-0 3 * * *}
      CHANNELS_DVR_RUN_IMMEDIATELY: ${CHANNELS_DVR_RUN_IMMEDIATELY:-true}
      DVR_LOG_FILE: ${DVR_LOG_FILE:-/var/log/dvr-scheduler.log}
      TZ: ${TZ:-UTC}
    env_file:
      - .env
    restart: unless-stopped

